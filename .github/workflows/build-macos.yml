name: Build macOS Desktop App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Tools
      run: |
        # 安装用于制作 DMG 的工具
        brew install create-dmg

    - name: Install dependencies
      run: |
        flutter pub get
        cd macos && pod install

    - name: Build macOS App
      run: flutter build macos --release

    - name: Create DMG Packages
      run: |
        cd build/macos/Build/Products/Release/
        
        # 使用你项目的真实名称 vocechat_client 制作 dmg 镜像
        create-dmg \
          --volname "VoceChat Installer" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "vocechat_client.app" 175 120 \
          --hide-extension "vocechat_client.app" \
          --app-drop-link 425 120 \
          "VoceChat-Client-Installer.dmg" "vocechat_client.app"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoceChat-macOS-Installer
        # 只上传 dmg 格式，完美锁死并保留 Mac 文件的执行权限
        path: build/macos/Build/Products/Release/VoceChat-Client-Installer.dmg
