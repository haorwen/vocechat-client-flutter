name: vocechat_client
description: "VoceChat cross-platform client"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State/data
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1
  connectivity_plus: ^6.0.5

  # SSE
  flutter_client_sse: ^2.0.3

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3

  # Logging
  logger: ^2.5.0

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  photo_view: ^0.15.0

  # Clipboard (cross-platform image/file paste — text-only Clipboard from
  # flutter/services cannot read image bytes)
  super_clipboard: ^0.8.24

  # Native file drag-and-drop onto the chat surface (web parity with the
  # `DnDTip` drop overlay). Desktop + web; mobile has no native DnD.
  desktop_drop: ^0.7.1
  # XFile type used by desktop_drop's drop payload.
  cross_file: ^0.3.4+2

  # Media playback
  video_player: ^2.9.2
  chewie: ^1.8.5
  just_audio: ^0.9.42

  # External
  url_launcher: ^6.3.1

  # App metadata (version/build number for the About page)
  package_info_plus: ^8.0.0

  # Markdown
  flutter_markdown: ^0.7.4+3

  # Date
  intl: any

  # Crypto
  crypto: ^3.0.3
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
