plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // com.google.gms.google-services (declared with apply false in
    // settings.gradle) is applied conditionally near the bottom of this
    // file, only when google-services.json is present — see that block for
    // why.
}

// Firebase's Google Services plugin requires a physical JSON file. CI can
// provide that file as a base64 secret without putting project credentials in
// the repository; a checked-in/local file still works when no secret is set.
def googleServicesFile = file("google-services.json")
def googleServicesJsonBase64 = System.getenv("GOOGLE_SERVICES_JSON_BASE64")
if (googleServicesJsonBase64?.trim()) {
    try {
        def normalizedBase64 = googleServicesJsonBase64.replaceAll(/\s+/, "")
        googleServicesFile.bytes = java.util.Base64.getDecoder().decode(normalizedBase64)
    } catch (IllegalArgumentException error) {
        throw new GradleException(
                "GOOGLE_SERVICES_JSON_BASE64 is not valid base64", error)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.vocechat.vocechat_client"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.vocechat.vocechat_client"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            // 签名信息在 android/key.properties(不入库);缺失时回退 debug 签名以便本地跑 release
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Apply Google Services only when its config file has been injected (e.g. by
// CI from a secret, or manually for local FCM testing) — see plugins block
// above for why this can't be a plain `apply plugin`.
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
}
