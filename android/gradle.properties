org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation — works around a known bug in
# kotlin-gradle-plugin 1.9.x/2.x where plugins with generated `.g.kt` files
# (e.g. shared_preferences_android via Pigeon) double-register cache storage
# and dump a long, harmless-but-noisy stack trace on every build.
# Gradle's own task-level cache still works, so subsequent builds are fast.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
